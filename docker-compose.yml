version: '3.8'

services:
  data-collector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tuya-data-collector
    restart: always
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: python backend/collector/data_collector.py

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sarimax-api
    restart: always
    ports:
      - "8000:8000"
    env_file: .env
    command: uvicorn backend.api.index:app --host 0.0.0.0 --port 8000

  dashboard-api:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: sarimax-dashboard-api
    restart: always
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      - FASTAPI_URL=http://api:8000
    depends_on:
      - api
